steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'build'
    - '-t'
    - 'us-central1-docker.pkg.dev/gitops-gke-pipeline/my-repo/app-image'
    - '.'

- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'push'
    - 'us-central1-docker.pkg.dev/gitops-gke-pipeline/my-repo/app-image'

images:
- 'us-central1-docker.pkg.dev/gitops-gke-pipeline/my-repo/app-image'